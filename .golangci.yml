version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - unconvert
  settings:
    staticcheck:
      # Everything except the QF* quickfix suggestions (De Morgan, tagged
      # switch, ...), which are editor hints rather than defects.
      checks: ["all", "-QF*", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    errcheck:
      exclude-functions:
        # Best-effort cleanup of read-only handles and scratch files.
        - (*os.File).Close
        - os.Remove
        - syscall.Munmap
        - (*github.com/giraffesyo/ingot/safetensors.Set).Close
        - (*github.com/giraffesyo/ingot/safetensors.File).Close
  exclusions:
    generated: lax
    rules:
      # Tests fail on the assertion that follows, not on the helper's error.
      - path: _test\.go
        linters: [errcheck]
      # asm generators print to stdout; a failed write surfaces as a bad diff.
      - path: kernels/.*/gen[^/]*/
        linters: [errcheck]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
